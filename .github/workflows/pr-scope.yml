name: pr-scope

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Classify PR scope
        env:
          PR_SCOPE_BASE: ${{ github.base_ref }}
          ALLOW_MIXED_SCOPE: ${{ contains(join(github.event.pull_request.labels.*.name, ','), 'allow-mixed-scope') }}
        run: |
          node --test scripts/pr-scope.test.mjs
          node scripts/verify-pr-scope.mjs
