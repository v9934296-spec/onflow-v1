name: one-time-netinfo-lock
on:
  push:
    branches: [fix/release-hardening-20261011]
    paths: [".github/workflows/one-time-netinfo-lock.yml"]
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/release-hardening-20261011
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --package-lock-only --save-exact --ignore-scripts @react-native-community/netinfo@11.4.1
      - run: npm ci --ignore-scripts
      - name: Commit verified dependency lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build: lock Expo SDK 53 NetInfo dependency"
            git fetch origin fix/release-hardening-20261011
            git rebase origin/fix/release-hardening-20261011
            git push origin HEAD:fix/release-hardening-20261011
          fi
